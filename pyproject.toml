[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icloud-mail-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.29.0",  # pinned to deployed version; 2.x renames mcp.server.fastmcp
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "starlette>=1.0.1",
    "pypdf==6.15.0",  # pinned to deployed version
]

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_mail_mcp"]