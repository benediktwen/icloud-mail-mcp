[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "icloud-mail-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.23.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "starlette>=0.40.0",
    "pypdf>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_mail_mcp"]
