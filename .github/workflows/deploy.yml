name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual redeploy from the Actions tab

permissions:
  contents: read  # the jobs only read the repo; the deploy uses its own SSH key

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"  # same as the Docker image
      - run: pip install -e ".[test]" && pytest -q

  deploy:
    needs: test  # a failing test stops the deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/ubuntu/mcps/icloud-mail-mcp
            git pull
            cd /home/ubuntu/mcps
            # The container runs as the host user (UID 1001), no longer as root.
            # Files the old root container wrote must belong to that user. Safe to repeat.
            sudo chown -R 1001:1001 /home/ubuntu/mcp-state/mail
            # --pull: newest base image; APT_REFRESH: refresh the Debian packages once a week
            docker compose build --pull --build-arg APT_REFRESH="$(date +%G-%V)" icloud-mail-mcp
            docker compose up -d icloud-mail-mcp
