name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual redeploy from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"  # same as the Docker image
      - run: pip install -e ".[test]" && pytest -q

  deploy:
    needs: test  # a failing test stops the deploy
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/ubuntu/mcps/icloud-mail-mcp
            git pull
            cd /home/ubuntu/mcps
            docker compose up -d --build icloud-mail-mcp
